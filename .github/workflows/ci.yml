name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: "nvim ${{ matrix.nvim-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim-version: [stable, nightly]

    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim (${{ matrix.nvim-version }})
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim-version }}

      - name: Install selene + StyLua (pinned in mise.toml)
        uses: jdx/mise-action@v2

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Cache .deps
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-mini-nvim-${{ hashFiles('tests/minit.lua') }}

      - name: Run CI (lint + test)
        run: make ci
